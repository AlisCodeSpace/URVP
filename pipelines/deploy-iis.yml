parameters:
  - name: environmentName
    type: string
  - name: aspNetEnvironment
    type: string
    values:
      - Staging
      - Production
  - name: agentPool
    type: string
    default: Default
  - name: capability
    type: string
  - name: publicHostname
    type: string
  - name: iisSiteName
    type: string
    default: FEA.URVP
  - name: iisPhysicalPath
    type: string
    default: 'C:\inetpub\wwwroot\FEA.URVP'

jobs:
  - deployment: IIS
    displayName: 'Deploy to IIS (${{ parameters.environmentName }})'
    environment: ${{ parameters.environmentName }}
    pool:
      name: ${{ parameters.agentPool }}
      demands:
        - Agent.OS -equals Windows_NT
        - ${{ parameters.capability }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - download: current
              artifact: app-release
              displayName: 'Download app-release'

            - powershell: |
                $zip = Join-Path $env:PIPELINE_WORKSPACE 'app-release\Build.zip'
                if (-not (Test-Path -LiteralPath $zip)) {
                  throw "Build.zip not found at $zip"
                }

                $extractRoot = Join-Path $env:AGENT_TEMPDIRECTORY 'urvp-extract'
                if (Test-Path -LiteralPath $extractRoot) {
                  Remove-Item -LiteralPath $extractRoot -Recurse -Force
                }
                Expand-Archive -LiteralPath $zip -DestinationPath $extractRoot -Force

                $source = Join-Path $extractRoot 'FEA.URVP\FEA.URVP.Backend'
                $dll = Join-Path $source 'FEA.URVP.Backend.dll'
                $index = Join-Path $source 'wwwroot\index.html'
                if (-not (Test-Path -LiteralPath $dll)) {
                  throw "FEA.URVP.Backend.dll missing under $source — zip layout looks wrong."
                }
                if (-not (Test-Path -LiteralPath $index)) {
                  throw "wwwroot\index.html missing under $source. The Next.js export was not packaged."
                }

                $site = if ($env:IIS_SITE_NAME) { $env:IIS_SITE_NAME } else { 'FEA.URVP' }
                $path = if ($env:IIS_PHYSICAL_PATH) { $env:IIS_PHYSICAL_PATH } else { 'C:\inetpub\wwwroot\FEA.URVP' }

                & "$(Build.SourcesDirectory)\scripts\iis\Publish-IisSite.ps1" `
                  -SourcePath $source `
                  -PhysicalPath $path `
                  -SiteName $site `
                  -EnvironmentName $env:DOTNET_ENVIRONMENT_NAME
              displayName: 'Publish onto IIS'
              env:
                DOTNET_ENVIRONMENT_NAME: ${{ parameters.aspNetEnvironment }}
                IIS_SITE_NAME: ${{ parameters.iisSiteName }}
                IIS_PHYSICAL_PATH: ${{ parameters.iisPhysicalPath }}

            - powershell: |
                $hostName = if ($env:PUBLIC_HOSTNAME) { $env:PUBLIC_HOSTNAME } else { '${{ parameters.publicHostname }}' }

                $urls = @(
                  "https://$hostName/health/live",
                  "http://127.0.0.1/health/live"
                )

                foreach ($url in $urls) {
                  try {
                    $response = Invoke-WebRequest -UseBasicParsing -Uri $url -Headers @{ Host = $hostName } -TimeoutSec 30
                    if ($response.StatusCode -eq 200 -and $response.Content -match 'healthy') {
                      Write-Host "OK $($response.StatusCode) $url"
                      exit 0
                    }
                    Write-Warning "$url returned $($response.StatusCode) $($response.Content)"
                  } catch {
                    Write-Warning "$url failed: $($_.Exception.Message)"
                  }
                }

                Write-Warning "Could not confirm /health/live. Check the IIS binding and certificate, then hit the URL from a browser."
              displayName: 'Probe /health/live'
              continueOnError: true
              env:
                PUBLIC_HOSTNAME: ${{ parameters.publicHostname }}
