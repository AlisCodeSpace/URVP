# Blueprint for a two-service Render demo deploy.
# After the first deploy, set the sync:false env vars in the dashboard:
#   API: ConnectionStrings__SqlServerConnection, Cors__AllowedOrigins, AzureAd__*, AdminEmails__0
# Role (Student/Faculty) is resolved via LDAP against AUB AD (win2k.aub.edu.lb), not token
# group claims. Render cannot reach on-prem AD unless VPN/private networking is added;
# until then LDAP lookups log a warning and the stored database role is kept.
#   Web: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_APP_URL, API_URL (same as NEXT_PUBLIC_API_URL)
# Cors__AllowedOrigins must be the exact frontend origin, e.g. https://urvp-web.onrender.com
# Azure AD redirect URI: https://<urvp-api-host>/signin-oidc-ad
# SQL Server is not hosted on Render — use Azure SQL (or another SQL Server).

services:
  - type: web
    name: urvp-api
    runtime: docker
    dockerfilePath: ./FEA.URVP.Backend/Dockerfile
    dockerContext: ./FEA.URVP.Backend
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER_RELOADCONFIGONCHANGE
        value: "false"
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: Database__SeedCatalogsOnStartup
        value: "true"
      - key: AzureAd__Instance
        value: https://login.microsoftonline.com/
      - key: AzureAd__CallbackPath
        value: /signin-oidc-ad
      - key: AzureAd__FrontendCallbackPath
        value: /auth/callback
      - key: ConnectionStrings__SqlServerConnection
        sync: false
      - key: Cors__AllowedOrigins
        sync: false
      - key: AzureAd__TenantId
        sync: false
      - key: AzureAd__ClientId
        sync: false
      - key: AdminEmails__0
        sync: false

  - type: web
    name: urvp-web
    runtime: node
    rootDir: FEA.URVP.Frontend
    buildCommand: npm ci --include=dev && npx next build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: API_URL
        sync: false
